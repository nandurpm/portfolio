# FILE PURPOSE: Validates staged blog/project uploads and publishes generated static portfolio content on pushes to the main branch.

name: Publish uploaded content

# Content publication is automatic for inbox changes and may also be run manually.
on:
  push:
    branches: [main]
    paths:
      - "uploads/blog/**"
      - "uploads/projects/**"
  workflow_dispatch:

# The final step writes only the generated publication result back to this repository.
permissions:
  contents: write

# Process publication commits in order so two inbox pushes cannot race each other.
concurrency:
  group: portfolio-content-publisher
  cancel-in-progress: false

jobs:
  publish:
    # The workflow's own generated commit must not start another publication cycle.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and publish uploads
        run: node scripts/publish-content.mjs

      - name: Render static content cards
        run: node scripts/render-static-content.mjs

      - name: Commit generated website files
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog.html projects.html blog works assets/data assets/images uploads
          git commit -m "Publish website content [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
