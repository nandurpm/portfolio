name: Sync public portfolio projects

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-projects.mjs
      - name: Regenerate static cards and sitemap
        run: node scripts/render-static-content.mjs
      - name: Commit changed public data
        run: |
          if git diff --quiet; then
            echo "Public project data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/github-projects.json index.html projects.html sitemap.xml
          git commit -m "chore: refresh public portfolio projects"
          git push
