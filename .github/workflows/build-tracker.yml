name: Build private tracker route
on:
  push:
    branches: [main]
    paths:
      - 'tools/tracker-source/**'
      - 'scripts/stage-tracker.mjs'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-main-writer
  cancel-in-progress: false
jobs:
  windows-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/tracker-source/.nvmrc
          cache: npm
          cache-dependency-path: tools/tracker-source/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
        working-directory: tools/tracker-source
      - name: Run financial and quality checks
        run: npm run lint && npm test && npm run typecheck:quality
        working-directory: tools/tracker-source
      - name: Build Windows installer
        env:
          INNO_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: npm run dist:win
        working-directory: tools/tracker-source
      - name: Verify installer metadata and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = 'tools/tracker-source/release/installers/Savings-and-Expense-Tracker-Setup-2.2.0.exe'
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not generated: $installer" }
          $version = (Get-Item -LiteralPath $installer).VersionInfo.ProductVersion
          if ($version -notlike '2.2.0*') { throw "Unexpected installer version: $version" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $installer | Format-List
          gh release upload tracker-v2.2.0 $installer --repo $env:GITHUB_REPOSITORY --clobber
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/tracker-source/.nvmrc
          cache: npm
          cache-dependency-path: tools/tracker-source/package-lock.json
      - name: Install pinned dependencies without native app downloads
        run: npm ci --ignore-scripts
        working-directory: tools/tracker-source
      - name: Build the sign-in-required website
        run: npm run test:planning && npm run typecheck:quality && npm run build:web && npm run check:bundle
        working-directory: tools/tracker-source
      - name: Retain the exact production web build and trusted manifest
        uses: actions/upload-artifact@v4
        with:
          name: tracker-production-web-build
          path: tools/tracker-source/dist-web
          retention-days: 14
      - name: Stage only the public web build
        run: node scripts/stage-tracker.mjs
      - name: Save generated assets from the latest source without stale rebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Other site workflows can update main after this run has checked out.
          # Never rebase an old generated bundle onto newer source: rebuild it.
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Main advanced; regenerating the tracker from its latest committed source."
              git reset --hard origin/main  # GitHub's disposable checkout only.
              (
                cd tools/tracker-source
                npm ci --ignore-scripts
                npm run test:planning
                npm run typecheck:quality
                npm run build:web
                npm run check:bundle
              )
              node scripts/stage-tracker.mjs
            fi
            git add track
            if git diff --cached --quiet; then
              echo "Generated assets already match the latest source."
              exit 0
            fi
            git commit -m 'Build sign-in-required tracker assets'
            if git push origin HEAD:main; then
              echo "Published tracker assets from a matching source tree."
              exit 0
            fi
            echo "Main changed during publication attempt $attempt; retrying a clean rebuild."
          done
          echo "Cannot safely publish after three concurrent updates." >&2
          exit 1
