<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' __TRACKER_CONNECT_SRC__; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <script src="/theme-init.js"></script>
    <meta
      name="description"
      content="Sign in to your personal savings, expenses and loan planning workspace."
    />
    <title>Savings and Expense Tracker</title>
    <style>
      .preload { min-height: 75vh; display: grid; place-content: center; justify-items: center; gap: 16px; color: #29334a; font: 500 15px/1.5 system-ui, sans-serif; text-align: center; }
      .preload img { width: 68px; height: 68px; }
      .preload-bar { height: 6px; width: min(220px, 70vw); border-radius: 99px; background: #d7d9ea; overflow: hidden; }
      .preload-bar::before { content: ''; display: block; height: 100%; width: 38%; border-radius: inherit; background: #6255df; animation: preload-move 1.3s ease-in-out infinite alternate; }
      @keyframes preload-move { from { transform: translateX(0); } to { transform: translateX(165%); } }
      @media (prefers-color-scheme: dark) { .preload { color: #e8e9f3; } .preload-bar { background: #41435b; } }
      @media (prefers-reduced-motion: reduce) { .preload-bar::before { animation: none; width: 100%; opacity: .65; } }
    </style>
    <link rel="stylesheet" href="/startup.css" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root">
      <main
        class="tracker-startup"
        data-tracker-bootstrap
        aria-label="Savings Tracker startup"
      >
        <img src="/icon.svg" alt="" aria-hidden="true" width="64" height="64" />
        <strong>Savings Tracker</strong>
        <span
          class="tracker-startup-mark"
          data-boot-spinner
          aria-hidden="true"
        ></span>
        <p data-boot-message role="status">Loading your tracker…</p>
        <button type="button" data-boot-retry hidden>Retry</button>
      </main>
    </div>
    <noscript>Enable JavaScript to use Savings and Expense Tracker.</noscript>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
