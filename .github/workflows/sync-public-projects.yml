name: Sync public portfolio projects

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: portfolio-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-projects.mjs
      - name: Regenerate static cards and sitemap
        run: node scripts/render-static-content.mjs
      - name: Commit changed public data
        run: |
          git add assets/data/github-projects.json index.html projects.html blog.html blog works sitemap.xml _headers
          if git diff --cached --quiet; then
            echo "Public project data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public portfolio projects"
          git pull --rebase origin main
          git push origin HEAD:main
