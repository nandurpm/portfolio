name: Release tracker web, Windows and Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'tracker-v*'
    paths:
      - 'tools/tracker-source/package.json'
      - '.github/workflows/tracker-unified-release.yml'

permissions:
  contents: write

concurrency:
  group: tracker-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
      windows_needed: ${{ steps.check.outputs.windows_needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip already-published versions on automatic branch pushes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./tools/tracker-source/package.json').version")"
          # UI-only Android releases retain the shared version policy without shipping an EXE.
          WINDOWS_NEEDED="$(node -e "const p=require('./tools/tracker-source/package.json'); const targets=p.trackerReleasePlatforms ?? ['android','windows']; if (!Array.isArray(targets) || !targets.includes('android') || targets.some(x => !['android','windows'].includes(x))) throw Error('Invalid trackerReleasePlatforms'); process.stdout.write(String(targets.includes('windows')))")"
          echo "windows_needed=$WINDOWS_NEEDED" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "branch" ]] && \
             gh release view "tracker-v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release_needed=false" >> "${GITHUB_OUTPUT}"
            echo "Release tracker-v${VERSION} is already published; no new APK or EXE needed."
          else
            echo "release_needed=true" >> "${GITHUB_OUTPUT}"
            echo "Release build requested for tracker-v${VERSION}."
          fi
  quality:
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/tracker-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/tracker-source/.nvmrc
          cache: npm
          cache-dependency-path: tools/tracker-source/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify version and release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "tracker-v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          fi
      - name: Run financial, lint, TypeScript and bundle checks
        run: npm run check
      - name: Build exact web payload
        run: npm run build:web && npm run check:bundle
      - name: Verify Web and native financial engine parity
        run: npm run build:release && node scripts/verify-financial-parity.mjs dist-web dist
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-web-${{ github.sha }}
          path: tools/tracker-source/dist-web
          if-no-files-found: error
          retention-days: 30

  windows:
    needs: [prepare, quality]
    if: needs.prepare.outputs.windows_needed == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/tracker-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/tracker-source/.nvmrc
          cache: npm
          cache-dependency-path: tools/tracker-source/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Build Windows x64 installer
        env:
          INNO_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: npm run dist:win
      - name: Verify installer and collect artifact
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/installers/Savings-and-Expense-Tracker-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing installer: $installer" }
          if ((Get-Item -LiteralPath $installer).Length -lt 50MB) { throw 'Installer is unexpectedly small.' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/tracker-windows" | Out-Null
          Copy-Item -LiteralPath $installer -Destination "$env:RUNNER_TEMP/tracker-windows/"
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-windows-${{ github.sha }}
          path: ${{ runner.temp }}/tracker-windows/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/tracker-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tools/tracker-source/.nvmrc
          cache: npm
          cache-dependency-path: tools/tracker-source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Restore authorized production signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRACKER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tracker-release.jks"
          chmod 600 "$RUNNER_TEMP/tracker-release.jks"
      - name: Install pinned dependencies
        run: npm ci
      - name: Build signed Android release APK
        env:
          TRACKER_KEYSTORE_PATH: ${{ runner.temp }}/tracker-release.jks
          TRACKER_KEYSTORE_PASSWORD: ${{ secrets.TRACKER_KEYSTORE_PASSWORD }}
          TRACKER_KEY_ALIAS: ${{ vars.TRACKER_ANDROID_KEY_ALIAS }}
        run: npm run android:release
      - name: Verify APK identity and collect artifact
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --min-sdk-version 34 --max-sdk-version 36 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.nandakumar.savingsexpensetracker'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/tracker-android"
          cp "$APK" "$RUNNER_TEMP/tracker-android/Savings-and-Expense-Tracker-$VERSION.apk"
      - name: Verify signing certificate matches previous published Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          export VERSION
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/tracker-releases.json"
          PREVIOUS_TAG="$(node - "$RUNNER_TEMP/tracker-releases.json" <<'NODE'
          const fs = require('node:fs');
          const releases = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const parse = (v) => /^\d+\.\d+\.\d+$/.test(v) ? v.split('.').map(Number) : null;
          const compare = (a, b) => {
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i];
            return 0;
          };
          const current = parse(process.env.VERSION);
          if (!current) throw new Error('Invalid package version');
          const valid = releases.filter(r => {
            const m = /^tracker-v(\d+\.\d+\.\d+)$/.exec(r.tag_name || '');
            return m && !r.draft && !r.prerelease && compare(parse(m[1]), current) < 0 &&
              r.assets?.some(a => a.name === `Savings-and-Expense-Tracker-${m[1]}.apk` && a.state === 'uploaded');
          }).sort((a, b) => compare(parse(b.tag_name.slice(9)), parse(a.tag_name.slice(9))));
          process.stdout.write(valid[0]?.tag_name ?? '');
          NODE
          )"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "::warning::No older production APK found; cannot check certificate continuity."
          else
            PREVIOUS_VERSION="${PREVIOUS_TAG#tracker-v}"
            mkdir -p "$RUNNER_TEMP/tracker-previous"
            gh release download "$PREVIOUS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "Savings-and-Expense-Tracker-$PREVIOUS_VERSION.apk" \
              --dir "$RUNNER_TEMP/tracker-previous"
            APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
            PREVIOUS_APK="$RUNNER_TEMP/tracker-previous/Savings-and-Expense-Tracker-$PREVIOUS_VERSION.apk"
            PREVIOUS_CERT="$("$APK_SIGNER" verify --print-certs "$PREVIOUS_APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
            CURRENT_CERT="$("$APK_SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
            if [[ -z "$PREVIOUS_CERT" || -z "$CURRENT_CERT" || "$PREVIOUS_CERT" != "$CURRENT_CERT" ]]; then
              echo "::error::Android signing certificate changed; this APK cannot update the previously installed app."
              exit 1
            fi
            echo "Android signing certificate matches previously published $PREVIOUS_TAG."
            echo "TRACKER_PREVIOUS_APK=$PREVIOUS_APK" >> "$GITHUB_ENV"
          fi
      - name: Prepare isolated Android 16 emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Linux runners support KVM. These permissions apply only
          # to this disposable CI machine; no user's device or data is accessed.
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          sdkmanager --install 'emulator' 'system-images;android-36;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --force --name tracker-api36 \
            --package 'system-images;android-36;google_apis;x86_64' --device pixel_6
          mkdir -p "$RUNNER_TEMP/tracker-android-evidence"
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd tracker-api36 -port 5554 \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader \
            -accel on -camera-back none -camera-front none \
            > "$RUNNER_TEMP/tracker-android-evidence/emulator.log" 2>&1 &
          timeout 300 adb -s emulator-5554 wait-for-device
          for attempt in $(seq 1 150); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
      - name: Verify signed APK installation and in-place upgrade
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          PKG=com.nandakumar.savingsexpensetracker
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION="$(node -p "require('./package.json').version")"
          # Only synthetic data on a newly created emulator; never sign in.
          # adb root is used solely to plant/read a non-financial private-file
          # marker because production APKs correctly disallow run-as.
          if [[ -n "${TRACKER_PREVIOUS_APK:-}" ]]; then
            adb -s emulator-5554 install "$TRACKER_PREVIOUS_APK"
            adb -s emulator-5554 shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS
            adb -s emulator-5554 shell am start -W -n "$PKG/.MainActivity"
            adb -s emulator-5554 shell am force-stop "$PKG"
            adb -s emulator-5554 root
            adb -s emulator-5554 wait-for-device
            APP_UID="$(adb -s emulator-5554 shell stat -c '%u' "/data/user/0/$PKG" | tr -d '\r')"
            [[ "$APP_UID" =~ ^[0-9]+$ ]]
            adb -s emulator-5554 shell "mkdir -p /data/user/0/$PKG/files; printf 'tracker-upgrade-fixture' > /data/user/0/$PKG/files/widget-upgrade-probe; chown $APP_UID:$APP_UID /data/user/0/$PKG/files /data/user/0/$PKG/files/widget-upgrade-probe; restorecon -RF /data/user/0/$PKG/files"
            adb -s emulator-5554 unroot
            adb -s emulator-5554 wait-for-device
          fi
          adb -s emulator-5554 install -r "$APK"
          if [[ -n "${TRACKER_PREVIOUS_APK:-}" ]]; then
            adb -s emulator-5554 root
            adb -s emulator-5554 wait-for-device
            test "$(adb -s emulator-5554 shell cat "/data/user/0/$PKG/files/widget-upgrade-probe" | tr -d '\r')" = tracker-upgrade-fixture
            adb -s emulator-5554 unroot
            adb -s emulator-5554 wait-for-device
            echo 'Previous signed APK upgraded successfully; isolated private-file marker survived.'
          fi
          adb -s emulator-5554 shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS
          adb -s emulator-5554 shell dumpsys package "$PKG" > "$RUNNER_TEMP/tracker-android-evidence/package.txt"
          grep -F "versionName=$VERSION" "$RUNNER_TEMP/tracker-android-evidence/package.txt"
          adb -s emulator-5554 shell am start -W -n "$PKG/.MainActivity" | tee "$RUNNER_TEMP/tracker-android-evidence/launch.txt"
          grep -F 'Status: ok' "$RUNNER_TEMP/tracker-android-evidence/launch.txt"
          adb -s emulator-5554 shell pidof "$PKG"
          adb -s emulator-5554 exec-out screencap -p > "$RUNNER_TEMP/tracker-android-evidence/installed.png"
      - name: Run native unit and widget instrumentation tests on Android 16
        timeout-minutes: 15
        env:
          TRACKER_KEYSTORE_PATH: ${{ runner.temp }}/tracker-release.jks
          TRACKER_KEYSTORE_PASSWORD: ${{ secrets.TRACKER_KEYSTORE_PASSWORD }}
          TRACKER_KEY_ALIAS: ${{ vars.TRACKER_ANDROID_KEY_ALIAS }}
          ANDROID_SERIAL: emulator-5554
        working-directory: tools/tracker-source/android
        run: |
          set -euo pipefail
          bash gradlew :app:testReleaseUnitTest :app:connectedReleaseAndroidTest
          adb -s emulator-5554 install -r app/build/outputs/apk/release/app-release.apk
          adb -s emulator-5554 install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          for phase in seed read; do
            adb -s emulator-5554 shell am force-stop com.nandakumar.savingsexpensetracker
            adb -s emulator-5554 shell am instrument -w \
              -e class com.nandakumar.savingsexpensetracker.WidgetsTest#separateProcessRestoresPrivateCacheAndPrivacy \
              -e widgetProcessPhase "$phase" \
              com.nandakumar.savingsexpensetracker.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/tracker-android-evidence/process-$phase.txt"
            grep -F 'OK (1 test)' "$RUNNER_TEMP/tracker-android-evidence/process-$phase.txt"
          done
      - name: Collect native test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tracker-android-evidence"
          adb -s emulator-5554 pull /sdcard/Android/data/com.nandakumar.savingsexpensetracker/files/widget-test-screenshots "$RUNNER_TEMP/tracker-android-evidence/" 2>/dev/null || true
          adb -s emulator-5554 logcat -d -s AndroidRuntime:E > "$RUNNER_TEMP/tracker-android-evidence/crashes.txt" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-android-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracker-android-evidence
            tools/tracker-source/android/app/build/reports/tests/testReleaseUnitTest
            tools/tracker-source/android/app/build/reports/androidTests/connected
            tools/tracker-source/android/app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 30
      - name: Stop isolated emulator
        if: always()
        shell: bash
        run: adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-android-${{ github.sha }}
          path: ${{ runner.temp }}/tracker-android/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, quality, windows, android]
    if: always() && needs.quality.result == 'success' && needs.android.result == 'success' && (needs.windows.result == 'success' || (needs.prepare.outputs.windows_needed == 'false' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          name: tracker-windows-${{ github.sha }}
          path: release-assets
        if: needs.prepare.outputs.windows_needed == 'true'
      - uses: actions/download-artifact@v4
        with:
          name: tracker-android-${{ github.sha }}
          path: release-assets
      - name: Package source and checksums
        shell: bash
        run: |
          VERSION="$(node -p "require('./tools/tracker-source/package.json').version")"
          TAG="tracker-v$VERSION"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$TAG" ]]; then exit 1; fi
          git archive --format=zip --output="release-assets/Savings-and-Expense-Tracker-$VERSION-Source.zip" HEAD tools/tracker-source scripts/stage-tracker.mjs .github/workflows
          cp "tools/tracker-source/CHANGELOG-$VERSION.md" release-assets/ 2>/dev/null || true
          (cd release-assets && shopt -s nullglob && assets=(*.exe *.apk *.zip) && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Publish one GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="tools/tracker-source/CHANGELOG-$VERSION.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [[ -f "$NOTES" ]]; then
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Savings and Expense Tracker $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Savings and Expense Tracker $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
      - name: Confirm public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tee release-assets/published-assets.txt
          if [[ "${{ needs.prepare.outputs.windows_needed }}" == "true" ]]; then
            grep -Fx "Savings-and-Expense-Tracker-Setup-$VERSION.exe" release-assets/published-assets.txt
          fi
          grep -Fx "Savings-and-Expense-Tracker-$VERSION.apk" release-assets/published-assets.txt
          grep -Fx "Savings-and-Expense-Tracker-$VERSION-Source.zip" release-assets/published-assets.txt
          grep -Fx 'SHA256SUMS.txt' release-assets/published-assets.txt
      - name: Check owner software release notification after asset verification
        env:
          TRACKER_BOT_CRON_SECRET: ${{ secrets.TRACKER_BOT_CRON_SECRET }}
        shell: bash
        run: |
          if [[ -z "$TRACKER_BOT_CRON_SECRET" ]]; then
            echo '::warning::TRACKER_BOT_CRON_SECRET is not configured. Existing scheduled bot checks remain the notification fallback.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 45 \
            --request POST \
            --header 'content-type: application/json' \
            --header "x-savings-cron-secret: $TRACKER_BOT_CRON_SECRET" \
            --data '{"kind":"updates"}' \
            'https://svqtisipjyymguswxteb.supabase.co/functions/v1/savings-tracker-bot'
